name: Desktop releases
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            command: dist:mac
            binary: dist-package/mac-arm64/Tag Maestro.app/Contents/MacOS/Tag Maestro
          - os: windows-latest
            platform: windows
            command: dist:win
            binary: dist-package/win-unpacked/Tag Maestro.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node -e "if ('v' + require('./package.json').version !== process.env.RELEASE_TAG) throw new Error('Tag does not match package version')"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/test-release.mjs
      - run: pnpm run ${{ matrix.command }}
      - name: Test the packaged app (isolated synthetic media only)
        run: node scripts/test-desktop.mjs "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.dmg
            dist-package/*.zip
            dist-package/*.exe
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-checksums.mjs release-assets
      - name: Publish only after both native builds and packaged tests pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Tag Maestro $RELEASE_TAG" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
